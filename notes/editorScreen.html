<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App - iPad</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(135deg, #faf7ff 0%, #f0f8ff 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        color: #5a4fcf;
      }

      .ipad-frame {
        width: 1024px;
        height: 768px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 3rem;
        box-shadow: 0 20px 60px rgba(124, 111, 212, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .toolbar {
        height: 60px;
        background: rgba(255, 255, 255, 0.8);
        border-bottom: 1px solid rgba(124, 111, 212, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        z-index: 10;
        backdrop-filter: blur(10px);
      }

      .toolbar-left {
        display: flex;
        gap: 15px;
        align-items: center;
      }

      .toolbar-center {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .toolbar-right {
        display: flex;
        gap: 15px;
        align-items: center;
      }

      .tool-btn {
        width: 40px;
        height: 40px;
        border: none;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 1.5rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        color: #5a4fcf;
        border: 1px solid rgba(124, 111, 212, 0.1);
      }

      .tool-btn:hover {
        background: rgba(124, 111, 212, 0.1);
        transform: scale(1.05);
      }

      .tool-btn.active {
        background: #7c6fd4;
        color: white;
        box-shadow: 0 8px 25px rgba(124, 111, 212, 0.3);
      }

      .pen-tool {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid rgba(124, 111, 212, 0.2);
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .pen-tool:hover {
        transform: scale(1.1);
        box-shadow: 0 4px 12px rgba(124, 111, 212, 0.2);
      }

      .pen-tool.active {
        border: 3px solid #7c6fd4;
        box-shadow: 0 0 0 3px rgba(124, 111, 212, 0.15);
      }

      .pen-black {
        background: #5a4fcf;
      }
      .pen-blue {
        background: #7c6fd4;
      }
      .pen-red {
        background: #ff9b9b;
      }
      .pen-green {
        background: #98d8c8;
      }

      .thickness-slider {
        width: 100px;
        height: 4px;
        appearance: none;
        -webkit-appearance: none;
        background: rgba(124, 111, 212, 0.2);
        border-radius: 2px;
        outline: none;
      }

      .thickness-slider::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        background: #7c6fd4;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(124, 111, 212, 0.3);
      }

      .thickness-slider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        background: #7c6fd4;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(124, 111, 212, 0.3);
        border: none;
      }

      .main-content {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      .canvas-container {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      .pages-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        gap: 40px;
      }

      .page-canvas-wrapper {
        width: 700px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 10px 40px rgba(124, 111, 212, 0.12);
        border-radius: 2rem;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(10px);
      }

      .page-canvas {
        display: block;
        width: 100%;
        height: 900px;
        cursor: crosshair;
        touch-action: none;
      }

      .page-number-label {
        position: absolute;
        top: -30px;
        left: 0;
        font-size: 13px;
        color: #7c6fd4;
        font-weight: 500;
        opacity: 0.8;
      }

      .add-page-zone {
        width: 700px;
        height: 120px;
        border: 3px dashed #7c6fd4;
        border-radius: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(124, 111, 212, 0.05);
      }

      .add-page-zone:hover {
        background: rgba(124, 111, 212, 0.12);
        transform: scale(1.02);
        box-shadow: 0 8px 25px rgba(124, 111, 212, 0.15);
      }

      .add-page-text {
        color: #7c6fd4;
        font-size: 16px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .add-page-text svg {
        width: 24px;
        height: 24px;
      }

      .sidebar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(92, 79, 207, 0.3);
        z-index: 99;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
        backdrop-filter: blur(4px);
      }

      .sidebar-overlay.visible {
        opacity: 1;
        visibility: visible;
      }

      .sidebar {
        position: fixed;
        left: -320px;
        top: 0;
        bottom: 0;
        width: 320px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 2px 0 30px rgba(124, 111, 212, 0.15);
        overflow-y: auto;
        padding: 20px;
        z-index: 100;
        transition: left 0.3s ease;
        border-right: 1px solid rgba(124, 111, 212, 0.1);
        backdrop-filter: blur(10px);
      }

      .sidebar.visible {
        left: 0;
      }

      .sidebar-header {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 20px;
        color: #7c6fd4;
      }

      .page-item {
        background: rgba(124, 111, 212, 0.08);
        border: 2px solid rgba(124, 111, 212, 0.2);
        border-radius: 1.5rem;
        padding: 12px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }

      .page-item:hover {
        border-color: #7c6fd4;
        background: rgba(124, 111, 212, 0.15);
        transform: translateX(4px);
        box-shadow: 0 8px 20px rgba(124, 111, 212, 0.15);
      }

      .page-item.active {
        border-color: #7c6fd4;
        background: rgba(124, 111, 212, 0.2);
        box-shadow: 0 8px 25px rgba(124, 111, 212, 0.2);
      }

      .page-number {
        font-size: 12px;
        color: #7c6fd4;
        margin-bottom: 8px;
        font-weight: 500;
      }

      .page-preview {
        width: 100%;
        height: 140px;
        background: white;
        border: 1px solid rgba(124, 111, 212, 0.1);
        border-radius: 1rem;
        overflow: hidden;
      }

      .divider {
        width: 1px;
        height: 24px;
        background: #ddd;
      }

      .page-indicator {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: rgba(124, 111, 212, 0.9);
        color: white;
        padding: 10px 18px;
        border-radius: 2rem;
        font-size: 14px;
        font-weight: 500;
        z-index: 5;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 25px rgba(124, 111, 212, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="ipad-frame">
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="tool-btn" id="pagesBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 3h7v7H3z"></path>
              <path d="M14 3h7v7h-7z"></path>
              <path d="M14 14h7v7h-7z"></path>
              <path d="M3 14h7v7H3z"></path>
            </svg>
          </button>
          <button class="tool-btn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </button>
        </div>

        <div class="toolbar-center">
          <button class="tool-btn active" id="penBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
            </svg>
          </button>
          <button class="tool-btn" id="highlighterBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M9 11l3 3L22 4"></path>
              <path
                d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
              ></path>
            </svg>
          </button>
          <button class="tool-btn" id="eraserBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 20H7L3 16l10-10 7 7-4 4"></path>
              <path d="M7 20v-5"></path>
            </svg>
          </button>
          <div class="divider"></div>
          <div class="pen-tool pen-black active" data-color="#000000"></div>
          <div class="pen-tool pen-blue" data-color="#007AFF"></div>
          <div class="pen-tool pen-red" data-color="#FF3B30"></div>
          <div class="pen-tool pen-green" data-color="#34C759"></div>
          <div class="divider"></div>
          <input
            type="range"
            class="thickness-slider"
            min="1"
            max="10"
            value="3"
            id="thicknessSlider"
          />
        </div>

        <div class="toolbar-right">
          <button class="tool-btn" id="undoBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 7v6h6"></path>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
          </button>
          <button class="tool-btn" id="redoBtn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 7v6h-6"></path>
              <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
            </svg>
          </button>
          <button class="tool-btn">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="12" cy="5" r="1"></circle>
              <circle cx="12" cy="19" r="1"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="main-content">
        <div class="canvas-container" id="canvasContainer">
          <div class="pages-wrapper" id="pagesWrapper">
            <!-- Pages will be added here dynamically -->
          </div>
        </div>
      </div>

      <div class="page-indicator" id="pageIndicator">Page 1 of 1</div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">Pages</div>
      <div id="pagesList">
        <!-- Page thumbnails will be added here -->
      </div>
    </div>

    <script>
      let pages = [];
      let currentPageIndex = 0;
      let isDrawing = false;
      let currentColor = "#000000";
      let currentThickness = 3;
      let currentTool = "pen";
      let allStrokes = [];

      function createPage() {
        const pageIndex = pages.length;

        const wrapper = document.createElement("div");
        wrapper.className = "page-canvas-wrapper";
        wrapper.dataset.pageIndex = pageIndex;

        const label = document.createElement("div");
        label.className = "page-number-label";
        label.textContent = `Page ${pageIndex + 1}`;

        const canvas = document.createElement("canvas");
        canvas.className = "page-canvas";
        canvas.width = 700;
        canvas.height = 900;

        wrapper.appendChild(label);
        wrapper.appendChild(canvas);

        const page = {
          canvas: canvas,
          ctx: canvas.getContext("2d"),
          strokes: [],
          redoStack: [],
        };

        pages.push(page);

        setupCanvasEvents(canvas, page);

        return wrapper;
      }

      function createAddPageZone() {
        const zone = document.createElement("div");
        zone.className = "add-page-zone";
        zone.innerHTML = `
                <div class="add-page-text">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add New Page
                </div>
            `;
        zone.onclick = () => addNewPage();
        return zone;
      }

      function addNewPage() {
        const pagesWrapper = document.getElementById("pagesWrapper");
        const addZone = pagesWrapper.querySelector(".add-page-zone");
        if (addZone) addZone.remove();

        const newPage = createPage();
        pagesWrapper.appendChild(newPage);
        pagesWrapper.appendChild(createAddPageZone());

        updatePageIndicator();
        updateSidebar();

        newPage.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      function initializeApp() {
        const pagesWrapper = document.getElementById("pagesWrapper");

        pagesWrapper.appendChild(createPage());
        pagesWrapper.appendChild(createAddPageZone());

        updatePageIndicator();
        updateSidebar();
      }

      function setupCanvasEvents(canvas, page) {
        let currentStroke = [];

        canvas.addEventListener("mousedown", (e) =>
          startDrawing(e, page, currentStroke)
        );
        canvas.addEventListener("mousemove", (e) =>
          draw(e, page, currentStroke)
        );
        canvas.addEventListener("mouseup", () =>
          stopDrawing(page, currentStroke)
        );
        canvas.addEventListener("mouseout", () =>
          stopDrawing(page, currentStroke)
        );
        canvas.addEventListener("touchstart", (e) =>
          startDrawing(e, page, currentStroke)
        );
        canvas.addEventListener("touchmove", (e) =>
          draw(e, page, currentStroke)
        );
        canvas.addEventListener("touchend", () =>
          stopDrawing(page, currentStroke)
        );
      }

      function startDrawing(e, page, currentStroke) {
        isDrawing = true;
        currentStroke.length = 0;
        const pos = getPosition(e, page.canvas);
        currentStroke.push({
          x: pos.x,
          y: pos.y,
          color: currentColor,
          thickness: currentThickness,
          tool: currentTool,
        });
      }

      function draw(e, page, currentStroke) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPosition(e, page.canvas);
        currentStroke.push({
          x: pos.x,
          y: pos.y,
          color: currentColor,
          thickness: currentThickness,
          tool: currentTool,
        });

        const ctx = page.ctx;
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentThickness;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (currentTool === "highlighter") {
          ctx.globalAlpha = 0.3;
          ctx.lineWidth = currentThickness * 3;
        } else if (currentTool === "eraser") {
          ctx.globalCompositeOperation = "destination-out";
          ctx.lineWidth = currentThickness * 4;
        } else {
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
        }

        ctx.beginPath();
        const prevPoint = currentStroke[currentStroke.length - 2];
        ctx.moveTo(prevPoint.x, prevPoint.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }

      function stopDrawing(page, currentStroke) {
        if (isDrawing && currentStroke.length > 0) {
          page.strokes.push([...currentStroke]);
          page.redoStack = [];
          updateSidebar();
        }
        isDrawing = false;
      }

      function getPosition(e, canvas) {
        const rect = canvas.getBoundingClientRect();
        const x =
          ((e.clientX || e.touches[0].clientX) - rect.left) *
          (canvas.width / rect.width);
        const y =
          ((e.clientY || e.touches[0].clientY) - rect.top) *
          (canvas.height / rect.height);
        return { x, y };
      }

      function redrawCanvas(page) {
        page.ctx.clearRect(0, 0, page.canvas.width, page.canvas.height);
        page.strokes.forEach((stroke) => {
          for (let i = 1; i < stroke.length; i++) {
            page.ctx.strokeStyle = stroke[i].color;
            page.ctx.lineWidth = stroke[i].thickness;
            page.ctx.lineCap = "round";
            page.ctx.lineJoin = "round";

            if (stroke[i].tool === "highlighter") {
              page.ctx.globalAlpha = 0.3;
              page.ctx.lineWidth = stroke[i].thickness * 3;
            } else {
              page.ctx.globalAlpha = 1;
            }

            page.ctx.globalCompositeOperation = "source-over";
            page.ctx.beginPath();
            page.ctx.moveTo(stroke[i - 1].x, stroke[i - 1].y);
            page.ctx.lineTo(stroke[i].x, stroke[i].y);
            page.ctx.stroke();
          }
        });
      }

      function updatePageIndicator() {
        document.getElementById("pageIndicator").textContent = `Page ${
          currentPageIndex + 1
        } of ${pages.length}`;
      }

      function updateSidebar() {
        const pagesList = document.getElementById("pagesList");
        pagesList.innerHTML = "";

        pages.forEach((page, index) => {
          const item = document.createElement("div");
          item.className = "page-item";
          if (index === currentPageIndex) item.classList.add("active");

          const number = document.createElement("div");
          number.className = "page-number";
          number.textContent = `Page ${index + 1}`;

          const preview = document.createElement("div");
          preview.className = "page-preview";

          const thumbCanvas = document.createElement("canvas");
          thumbCanvas.width = 280;
          thumbCanvas.height = 140;
          const thumbCtx = thumbCanvas.getContext("2d");
          thumbCtx.drawImage(page.canvas, 0, 0, 280, 140);
          preview.appendChild(thumbCanvas);

          item.appendChild(number);
          item.appendChild(preview);
          item.onclick = () => scrollToPage(index);

          pagesList.appendChild(item);
        });
      }

      function scrollToPage(index) {
        const wrapper = document.querySelector(`[data-page-index="${index}"]`);
        if (wrapper) {
          wrapper.scrollIntoView({ behavior: "smooth", block: "center" });
          currentPageIndex = index;
          updatePageIndicator();
          toggleSidebar();
        }
      }

      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebarOverlay");
        sidebar.classList.toggle("visible");
        overlay.classList.toggle("visible");
      }

      // Observe which page is in view
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
              currentPageIndex = parseInt(entry.target.dataset.pageIndex);
              updatePageIndicator();
            }
          });
        },
        { threshold: 0.5 }
      );

      document
        .getElementById("pagesWrapper")
        .addEventListener("DOMNodeInserted", (e) => {
          if (
            e.target.classList &&
            e.target.classList.contains("page-canvas-wrapper")
          ) {
            observer.observe(e.target);
          }
        });

      // Toolbar events
      document.querySelectorAll(".pen-tool").forEach((tool) => {
        tool.addEventListener("click", function () {
          document
            .querySelectorAll(".pen-tool")
            .forEach((t) => t.classList.remove("active"));
          this.classList.add("active");
          currentColor = this.dataset.color;
        });
      });

      document
        .getElementById("thicknessSlider")
        .addEventListener("input", function () {
          currentThickness = this.value;
        });

      document.getElementById("penBtn").addEventListener("click", function () {
        document
          .querySelectorAll(".toolbar-center .tool-btn")
          .forEach((b) => b.classList.remove("active"));
        this.classList.add("active");
        currentTool = "pen";
      });

      document
        .getElementById("highlighterBtn")
        .addEventListener("click", function () {
          document
            .querySelectorAll(".toolbar-center .tool-btn")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          currentTool = "highlighter";
        });

      document
        .getElementById("eraserBtn")
        .addEventListener("click", function () {
          document
            .querySelectorAll(".toolbar-center .tool-btn")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          currentTool = "eraser";
        });

      document.getElementById("undoBtn").addEventListener("click", function () {
        if (
          pages[currentPageIndex] &&
          pages[currentPageIndex].strokes.length > 0
        ) {
          const stroke = pages[currentPageIndex].strokes.pop();
          pages[currentPageIndex].redoStack.push(stroke);
          redrawCanvas(pages[currentPageIndex]);
          updateSidebar();
        }
      });

      document.getElementById("redoBtn").addEventListener("click", function () {
        if (
          pages[currentPageIndex] &&
          pages[currentPageIndex].redoStack.length > 0
        ) {
          const stroke = pages[currentPageIndex].redoStack.pop();
          pages[currentPageIndex].strokes.push(stroke);
          redrawCanvas(pages[currentPageIndex]);
          updateSidebar();
        }
      });

      document
        .getElementById("pagesBtn")
        .addEventListener("click", toggleSidebar);
      document
        .getElementById("sidebarOverlay")
        .addEventListener("click", toggleSidebar);

      initializeApp();
    </script>
  </body>
</html>
